<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>BiBi Fantasy · 联盟中心</title><style>
:root{font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif;color:#202124;background:#f4f5f7;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#16181c;color:white;border-bottom:4px solid #e31c25}header .inner{max-width:1180px;margin:auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900;letter-spacing:-.04em;font-size:23px}.brand span{color:#ff4b50}.headnote{font-size:14px;color:#c7c9cd}main{max-width:1180px;margin:auto;padding:32px 24px 70px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.05em;margin:5px 0}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:#cb2027;font-weight:800}.muted{color:#697078;font-size:14px;line-height:1.5}.status{background:#fff5e3;color:#7a4b00;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:14px}.card{background:#fff;border:1px solid #e3e5e8;border-radius:12px;overflow:hidden;margin-bottom:18px}.cardhead{padding:20px 22px;border-bottom:1px solid #ebecee;display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:19px;margin:0}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.grid .card{margin:0}.match{padding:18px 22px;border-bottom:1px solid #eee}.match:last-child{border:0}.teams{display:flex;justify-content:space-between;gap:15px;font-weight:700}.score{font-size:23px;font-weight:900;white-space:nowrap}.sub{color:#7a8088;font-size:14px;margin-top:8px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:13px 20px;border-bottom:1px solid #eff0f2;white-space:nowrap}th{font-size:13px;color:#707780;font-weight:600}td{font-size:15px}tr:last-child td{border:0}.mine{color:#ca1d25;font-weight:800}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{font:inherit;font-size:14px;padding:10px;border:1px solid #d9dce0;border-radius:7px;background:white}.empty{padding:25px;color:#737a83;line-height:1.6}.foot{font-size:14px;color:#737a83;line-height:1.6;margin-top:24px}@media(max-width:760px){main{padding:24px 16px 50px}.grid{grid-template-columns:1fr}.top{display:block}.headnote{display:none}.cardhead{align-items:start;flex-direction:column}}
</style></head><body><header><div class="inner"><div class="brand"><span>BiBi</span> FANTASY</div><div class="headnote">联盟中心 · H2H POINTS</div></div></header><main><div class="top"><div><div class="eyebrow">Fantasy basketball / league 56429990</div><h1>联盟中心</h1><div class="muted" id="updated">正在读取联盟数据</div></div><a href="https://fantasy.espn.com/basketball/league?leagueId=56429990" target="_blank" rel="noopener">打开 ESPN 联盟</a></div><div class="status" id="notice">等待同步状态</div><div class="grid"><section class="card"><div class="cardhead"><h2>本周对阵</h2><span class="muted" id="week"></span></div><div id="matchups" class="empty">等待数据</div></section><section class="card"><div class="cardhead"><h2>联盟排名</h2><span class="muted">按胜率与总得分排序</span></div><div class="tablewrap"><table><thead><tr><th>球队</th><th>战绩</th><th>总得分</th></tr></thead><tbody id="teams"></tbody></table></div></section></div><section class="card" style="margin-top:18px"><div class="cardhead"><div><h2>可签约球员</h2><div class="sub">ESPN 可用球员 · 请在操作前复核伤病和豁免状态</div></div><div class="tools"><input id="search" type="search" placeholder="搜索球员" aria-label="搜索球员"><select id="position" aria-label="位置筛选"><option value="">全部位置</option><option value="1">PG</option><option value="2">SG</option><option value="3">SF</option><option value="4">PF</option><option value="5">C</option></select></div></div><div class="tablewrap"><table><thead><tr><th>球员</th><th>位置</th><th>状态</th><th>伤病</th><th>赛季场均</th></tr></thead><tbody id="players"></tbody></table></div><div class="empty" id="noPlayers" hidden>没有符合条件的球员。</div></section><p class="foot">比赛预测由 ESPN 提供，仅在有返回时展示；赛季场均和实时比分取决于 ESPN 数据。球队战力模型、近 15 天趋势和针对性建议将在数据来源验证后加入。</p></main><script>
const $=s=>document.querySelector(s), pos={1:'PG',2:'SG',3:'SF',4:'PF',5:'C'};let data;function el(tag,text,cls){const x=document.createElement(tag);if(text!=null)x.textContent=text;if(cls)x.className=cls;return x}function row(table,values){let tr=el('tr');values.forEach(v=>tr.append(el('td',v)));table.append(tr)}function val(x){return typeof x==='number'&&Number.isFinite(x)?Math.round(x*10)/10:'—'}function showPlayers(){let list=data.players.filter(p=>p.name.toLowerCase().includes($('#search').value.trim().toLowerCase())&&(!$('#position').value||String(p.position_id)===$('#position').value));$('#players').replaceChildren();for(const p of list)row($('#players'),[p.name,pos[p.position_id]||'—',p.status==='FREEAGENT'?'自由球员':p.status==='WAIVERS'?'豁免期':p.status||'—',p.injury||'—',val(p.season_average)]);$('#noPlayers').hidden=list.length>0}async function init(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();$('#updated').textContent='上次成功同步：'+new Date(data.updated_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'（北京时间）';$('#notice').textContent=data.notice;$('#week').textContent='第 '+data.matchup_period+' 对阵周期';let names=Object.fromEntries(data.teams.map(t=>[t.id,t.name]));let box=$('#matchups');box.className='';box.replaceChildren();for(let m of data.matchups){let wrap=el('div',null,'match'),top=el('div',null,'teams');top.append(el('span',(names[m.away.team_id]||'—')+' vs '+(names[m.home.team_id]||'—')),el('span',val(m.away.score)+' : '+val(m.home.score),'score'));wrap.append(top,el('div','ESPN 预计：'+val(m.away.projected)+' : '+val(m.home.projected),'sub'));box.append(wrap)}if(!data.matchups.length)box.append(el('div','当前没有返回对阵数据','empty'));data.teams.sort((a,b)=>{let rate=t=>(t.wins+.5*t.ties)/Math.max(1,t.wins+t.losses+t.ties);return rate(b)-rate(a)||(b.points_for||0)-(a.points_for||0)});for(let t of data.teams)row($('#teams'),[t.name,`${t.wins}-${t.losses}${t.ties?'-'+t.ties:''}`,val(t.points_for)]);showPlayers()}catch(e){$('#updated').textContent='尚未连接联盟';$('#notice').textContent='尚无已验证的联盟快照。配置授权并成功同步后，这里才会显示真实数据。';$('#matchups').textContent='暂无数据'}}$('#search').addEventListener('input',()=>data&&showPlayers());$('#position').addEventListener('change',()=>data&&showPlayers());init();
</script></body></html>
